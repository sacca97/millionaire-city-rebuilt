[package]
name = "millionaire-city"
version = "0.2.0"
edition = "2021"
description = "Millionaire City desktop app: Tauri window around the web client, with the Rust game server embedded"
publish = false

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
mcity-server = { path = "../../server-rs" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
