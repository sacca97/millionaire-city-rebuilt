name: Build Desktop Apps

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            bundles: nsis
            artifact_name: millionaire-city-windows-x64
          - label: Linux x64
            os: ubuntu-22.04
            bundles: deb,appimage,rpm
            artifact_name: millionaire-city-linux-x64
          - label: macOS Apple Silicon
            os: macos-latest
            bundles: dmg
            artifact_name: millionaire-city-macos-arm64
          - label: macOS Intel x64
            os: macos-15-intel
            bundles: dmg
            artifact_name: millionaire-city-macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev patchelf file

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-tauri-${{ matrix.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock', 'apps/server-rs/Cargo.lock') }}

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix apps/desktop ci

      # beforeBuildCommand (apps/desktop/scripts/prepare.mjs) builds the web client; cargo builds the Tauri shell with the game server embedded.
      # Build on the runner's own OS and CPU: no cross-compiling.
      - name: Build the desktop app
        run: npm --prefix apps/desktop run build -- --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
